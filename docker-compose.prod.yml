services:
  # ---------------------------------------------------------------------------
  # Frontend Application (Next.js Standalone)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ielts-center}-frontend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE_PATH:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - default
      - web_gateway

